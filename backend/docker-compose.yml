# Опционально: PostgreSQL + Adminer, если Docker установлен.
# Без Docker используйте SQLite (см. README и DATABASE_URL в .env.example).

services:
  db:
    image: postgres:16-alpine
    container_name: medi-postgres
    environment:
      POSTGRES_USER: medi
      POSTGRES_PASSWORD: medi
      POSTGRES_DB: medi
    ports:
      - "5432:5432"
    volumes:
      - medi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medi -d medi"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Веб-интерфейс для просмотра таблиц (пользователи, лекарства, …)
  adminer:
    image: adminer:4
    container_name: medi-adminer
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  medi_pgdata:
